<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="차량의 길을 열고 같은 색 승객을 태우는 터치 퍼즐 프로토타입">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ffcf55'/%3E%3Cpath d='M7 12h18v11H7z' fill='%23152233'/%3E%3Cpath d='M11 8h10l3 4H8z' fill='%234597ff'/%3E%3Ccircle cx='11' cy='24' r='3' fill='%23fff'/%3E%3Ccircle cx='22' cy='24' r='3' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <title>픽업 러시: 컬러 정류장</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">▣</span>
        <div><strong>픽업 러시</strong><small>컬러 정류장</small></div>
      </div>
      <button id="help" class="icon-button" aria-label="게임 방법">?</button>
    </header>

    <section class="stage-head" aria-labelledby="level-title">
      <div><span id="level-label" class="eyebrow"></span><h1 id="level-title"></h1></div>
      <select id="level-picker" class="stage-select" aria-label="스테이지 선택"></select>
    </section>

    <section class="station" aria-label="정류장 승객과 차량 대기 칸">
      <div class="station-row"><span class="station-label">다음 승객</span><span id="queue-count" class="queue-count"></span></div>
      <div id="queue" class="queue" aria-live="polite"></div>
      <div id="bays" class="bays"></div>
    </section>

    <section class="board-wrap" aria-label="교통 퍼즐">
      <div id="board" class="board"></div>
    </section>

    <p id="message" class="status-line" aria-live="polite"></p>

    <nav class="controls" aria-label="게임 조작">
      <button id="undo" class="control"><span class="control-icon">↶</span><span class="control-label">되돌리기</span></button>
      <button id="reset" class="control"><span class="control-icon">↻</span><span class="control-label">다시 시작 · <span id="move-count">0수</span></span></button>
      <button id="rotate" class="control accent"><span class="control-icon">⇥</span><span class="control-label">줄 바꾸기 <span id="rotate-count" class="badge">1</span></span></button>
      <button id="extra-bay" class="control accent"><span class="control-icon">▤</span><span class="control-label">칸 추가 <span id="bay-count" class="badge">1</span></span></button>
    </nav>
  </main>

  <section id="result-overlay" class="result-overlay" hidden>
    <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
      <div class="result-emoji" aria-hidden="true">🚌</div>
      <h2 id="result-title"></h2>
      <p id="result-copy"></p>
      <button id="next-level" class="primary"></button>
      <button id="close-result" class="link-button">보드 다시 보기</button>
    </div>
  </section>

  <dialog id="help-dialog">
    <h2>게임 방법</h2>
    <ol>
      <li>화살표 방향의 길이 비어 있는 차량을 누릅니다.</li>
      <li>정류장에 온 차량은 같은 색 승객 3명을 태웁니다.</li>
      <li>대기 칸이 다른 색 차량으로 모두 막히기 전에 승객을 모두 태우세요.</li>
    </ol>
    <button id="close-help" class="primary">게임으로 돌아가기</button>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
