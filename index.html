<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#b4c5da"><meta name="description" content="입체 차량을 빼내고 승객을 직접 태우는 교통 퍼즐"><title>픽업 러시 · 교통 정류장</title><link rel="manifest" href="./manifest.webmanifest?v=13"><link rel="stylesheet" href="./style.css?v=13"></head>
<body><main id="game"><canvas id="scene" width="600" height="1080" aria-label="입체 주차장, 차량 화살표 방향으로 길을 열어 승객을 태우세요"></canvas>
<div id="car-targets" aria-label="주차장 차량"></div>
<header><button id="settings" class="round" aria-label="설정 및 스테이지 선택">⚙</button><div class="logo">픽업 러시<small>COLOR STATION</small></div><div class="coins">🟡 <span id="coin-count">60</span></div></header>
<div id="locked-targets" aria-label="정류장 확장"></div>
<div id="toast" role="status" aria-live="polite"></div>
<footer><button id="undo"><b>↶</b><span>되돌리기</span></button><button id="sort"><b>⇄</b><span>승객 정렬</span><small id="sort-count">1</small></button><button id="ad"><b>＋</b><span>정류장 확장</span><small>AD</small></button></footer>
<div class="hint" id="hint">화살표 앞이 빈 차를 눌러보세요</div>
<div id="modal" class="modal" hidden><section><button id="close" aria-label="닫기">×</button><h1 id="modal-title"></h1><div id="modal-body"></div><button id="primary" class="primary">계속하기</button></section></div>
</main><script type="module" src="./app.js?v=13"></script></body></html>
