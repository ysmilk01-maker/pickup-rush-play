<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#211e33"><meta name="description" content="엉킨 셔틀을 꺼내 같은 색 옷의 손님을 태우고 야시장으로 출발하는 퍼즐"><title>야시장 한입특급 · Night Bite Express</title><link rel="manifest" href="./manifest.webmanifest?v=20"><link rel="stylesheet" href="./style.css?v=20"></head>
<body><main id="game"><canvas id="scene" width="600" height="1080" aria-label="야시장 셔틀 퍼즐. 화살표 앞이 열린 차를 꺼내 줄 맨 앞 손님과 같은 색 셔틀에 태우세요."></canvas>
<div id="car-targets" aria-label="야시장 셔틀"></div>
<header><button id="settings" class="round" aria-label="도움말 및 단계 선택">☰</button><div class="logo">야시장 한입특급<small>NIGHT MARKET SHUTTLE</small></div><button id="town" class="town-button" aria-label="우리 야시장과 꾸미기">🏮</button><div class="coins">● <span id="coin-count">60</span></div></header>
<div id="queue-summary" role="status" aria-label="맨 앞 손님"></div>
<div id="locked-targets" aria-label="승강장 확장"></div><div id="toast" role="status" aria-live="polite"></div>
<footer><button id="undo"><b>↶</b><span>되돌리기</span><small>무료</small></button><button id="guide"><b>✦</b><span>길 찾기</span><small>무료</small></button><button id="ad"><b>＋</b><span>승강장 확장</span><small>AD</small></button></footer>
<div class="hint" id="hint"></div><div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden><section><button id="close" aria-label="닫기">×</button><h1 id="modal-title"></h1><div id="modal-body"></div><button id="primary" class="primary">계속하기</button></section></div>
</main><script type="module" src="./app.js?v=20"></script></body></html>
