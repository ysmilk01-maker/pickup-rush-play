<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>셔틀 제작실 · 200단계 미리보기</title><link rel="stylesheet" href="./studio.css?v=57"></head><body>
<header><div><small>NINETOSIX LAB · STAGE STUDIO</small><h1>한 판씩, 길을 만드는 곳</h1><p>200단계 미리보기 · 배치 편집 · 해법 리플레이</p></div><a href="./">게임으로 돌아가기 ↗</a></header>
<main><section class="controls"><div class="card"><label for="level">미리 볼 단계</label><div class="row"><button id="previous" aria-label="이전 단계">‹</button><select id="level"></select><button id="next" aria-label="다음 단계">›</button></div><p id="profile"></p><div class="row"><button id="step">한 대 배차</button><button id="auto">해법 재생</button><button id="reset">원본 복원</button></div><label class="check"><input id="assist" type="checkbox" checked> 색상 구분 기호</label><label for="speed">재생 속도</label><select id="speed"><option value="1">1배</option><option value="2">2배</option><option value="4">4배</option></select><p id="status" role="status" aria-live="polite"></p></div>
<div class="card"><h2>퍼즐 장치</h2><p id="devices"></p><div id="queue" aria-label="대기열 미리보기"></div><p id="garage"></p><div id="events" role="log" aria-label="최근 게임 이벤트"></div></div>
<div class="card"><h2>배치 실험</h2><p>차를 누르면 선택합니다. 편집은 이 제작실에만 적용되며 게임 진행 기록은 바뀌지 않습니다.</p><label for="car">선택 차량</label><select id="car"></select><div class="fields"><label>X<input id="x" type="number" step="1"></label><label>Y<input id="y" type="number" step="1"></label><label>방향 °<input id="angle" type="number" step="1"></label></div><button id="apply-car">위치·방향 적용</button><label for="queue-edit">승객 순서 (색상 ID, 쉼표 구분)</label><textarea id="queue-edit" rows="3" spellcheck="false"></textarea><button id="apply-queue">승객 순서 적용</button><label for="triggers">차고 입차 시점 (배차 수)</label><input id="triggers" placeholder="예: 8, 18, 28"><button id="apply-garage">입차 시점 적용</button><div class="row"><button id="validate">배치 검증</button><button id="export">설계 JSON 저장</button></div><p class="note">기하 검증과 실제 4칸 해법 재생은 별개입니다. 배치·줄을 바꾸면 리플레이로 클리어 여부까지 확인하세요.</p></div></section>
<section class="preview"><canvas id="scene" width="600" height="1080" aria-label="스테이지 미리보기"></canvas><p>차고 입차·색 공개·차단기 개방·승객 탑승을 실제 게임 로직으로 재생합니다.</p></section></main><script type="module" src="./studio.js?v=57"></script></body></html>
